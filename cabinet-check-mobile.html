<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cabinet Check">
<title>Cabinet Check</title>
<style>
  :root{
    --navy:#1a237e; --navy-d:#11164f; --blue:#1565c0;
    --green:#2e7d32; --green-bg:#e8f5e9; --green-soft:#f1f8f2; --green-line:#a6d7ad;
    --amber:#b8791a; --amber-bg:#fff5e6; --amber-line:#f0cd8f;
    --red:#c0392b; --red-bg:#fdecea; --red-line:#f0b7b0;
    --page:#eef0f4; --card:#fff; --line:#d3d7e2; --line-soft:#e6e9f2;
    --ink:#1a1a1a; --muted:#6b6f80; --dim:#9aa0b0;
    --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:var(--sys); font-size:16px; color:var(--ink); background:var(--page);
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font-family:inherit;font-size:16px;color:inherit}

  /* ───────── header ───────── */
  header{ background:var(--navy); color:#fff; flex:none; padding-top:env(safe-area-inset-top); box-shadow:0 2px 8px rgba(10,20,60,.25); z-index:10; }
  .hdr-top{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px 8px; }
  .brand{ font-size:17px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  .brand small{ display:block; font-size:10px; font-weight:600; letter-spacing:1px; color:#aeb8de; margin-top:1px; }
  .seg{ display:flex; background:rgba(255,255,255,.14); border-radius:9px; padding:3px; }
  .seg button{ font-size:13px; font-weight:700; padding:6px 12px; border-radius:7px; color:#cfd5ee; }
  .seg button.active{ background:#fff; color:var(--navy); }
  .hdr-sub{ display:flex; align-items:center; justify-content:space-between; padding:0 14px 9px; gap:10px; }
  .meta-sum{ font-size:12.5px; color:#cfd5ee; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .overall{ font-size:13px; font-weight:800; color:#fff; flex:none; }
  .pbar{ height:5px; background:rgba(255,255,255,.16); }
  .pfill{ height:100%; width:0; background:linear-gradient(90deg,#8fd3a6,#2e7d32); transition:width .25s ease; }

  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 18px; }

  /* card */
  .card{ background:var(--card); border-radius:14px; box-shadow:0 1px 6px rgba(20,30,70,.10); overflow:hidden; }
  .card-hd{ background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .card-hd.good{ background:var(--green); }
  .card-hd.att{ background:#8a5a12; }
  .g-code{ font-size:32px; font-weight:800; letter-spacing:.5px; line-height:1; }
  .g-meta{ flex:1; font-size:12.5px; color:#cfd5ee; line-height:1.35; font-weight:600; }
  .card-hd.good .g-meta{ color:#d5f0dc; } .card-hd.att .g-meta{ color:#f0e0c4; }
  .g-chip{ flex:none; font-size:12px; font-weight:800; background:rgba(255,255,255,.18); padding:6px 11px; border-radius:20px; text-align:center; line-height:1.2; }

  .hint-line{ font-size:13px; color:var(--muted); font-weight:600; padding:11px 16px 4px; }
  .hint-line b{ color:var(--red); }

  .items{ padding:6px 10px 4px; }
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    min-height:54px; padding:8px 12px; margin:6px 0; border:1.5px solid var(--line);
    border-radius:11px; user-select:none; background:#fff; transition:background .12s,border-color .12s;
  }
  .item:active{ background:#f4f6fb; }
  .item.low{ background:var(--red-bg); border-color:var(--red-line); }
  .i-name{ font-size:16.5px; font-weight:600; }
  .i-name .hint{ font-style:normal; font-size:12px; font-weight:700; color:var(--blue); margin-left:6px; }
  .item.low .i-name{ color:var(--red); }
  .tag{ flex:none; font-size:12px; font-weight:800; color:var(--dim); letter-spacing:.5px; min-width:52px; text-align:right; }
  .item.low .tag{ color:var(--red); }
  .box{ flex:none; width:28px; height:28px; border:2px solid #c4c8d6; border-radius:8px; display:grid; place-items:center; font-size:18px; font-weight:800; color:transparent; }
  .item.low .box{ background:var(--red); border-color:var(--red); color:#fff; }

  .chips-wrap{ padding:8px 14px 4px; }
  .chips-l{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin-bottom:7px; }
  .qchips{ display:flex; flex-wrap:wrap; gap:8px; }
  .qchip{ font-size:13.5px; font-weight:700; padding:8px 14px; border:1.5px solid var(--line); border-radius:20px; color:var(--muted); background:#fff; }
  .qchip.on{ background:var(--amber-bg); border-color:var(--amber-line); color:var(--amber); }

  .note-wrap{ padding:8px 14px 16px; }
  .note-wrap input{ width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px; }
  .note-wrap input:focus{ outline:none; border-color:var(--blue); background:#fffdf5; }

  /* overview */
  .ov-card{ background:var(--card); border-radius:14px; box-shadow:0 1px 6px rgba(20,30,70,.08); padding:16px; margin-bottom:12px; }
  .ov-card h3{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--navy); margin-bottom:12px; font-weight:800; }
  .field{ margin-bottom:12px; } .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px; }
  .field input{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; }
  .field input:focus{ outline:none; border-color:var(--blue); }

  .stats{ display:flex; gap:10px; }
  .stat{ flex:1; text-align:center; border-radius:12px; padding:12px 6px; border:1px solid var(--line-soft); }
  .stat.g{ background:var(--green-soft); border-color:var(--green-line); }
  .stat.a{ background:var(--amber-bg); border-color:var(--amber-line); }
  .stat.n{ background:#f2f4f8; }
  .stat .n{ font-size:26px; font-weight:800; color:var(--navy); line-height:1; }
  .stat .l{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:5px; }

  .fseg{ display:flex; background:#eef0f7; border-radius:10px; padding:3px; margin-bottom:14px; }
  .fseg button{ flex:1; font-size:13px; font-weight:700; padding:8px 4px; border-radius:8px; color:var(--muted); }
  .fseg button.active{ background:var(--navy); color:#fff; }

  .zone-blk{ margin-bottom:16px; }
  .zone-ttl{ display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; }
  .zone-ttl .van{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:0; text-transform:none; }
  .chips{ display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:8px; }
  .chip{ border:1.5px solid var(--line); border-radius:11px; padding:9px 4px; text-align:center; background:#fff; }
  .chip:active{ background:#f0f2f8; }
  .chip .c{ font-size:15px; font-weight:800; color:var(--ink); }
  .chip .f{ font-size:10.5px; font-weight:700; color:var(--dim); margin-top:2px; }
  .chip.good{ background:var(--green-bg); border-color:var(--green-line); }
  .chip.good .c,.chip.good .f{ color:var(--green); }
  .chip.att{ background:var(--amber-bg); border-color:var(--amber-line); }
  .chip.att .c,.chip.att .f{ color:var(--amber); }
  .chip.here{ box-shadow:0 0 0 2.5px var(--blue); }

  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .actions button{ padding:12px 8px; border-radius:11px; font-weight:700; font-size:14px; border:1.5px solid var(--navy); color:var(--navy); background:#fff; }
  .actions button:active{ background:#eef0f7; }
  .actions button.solid{ background:var(--navy); color:#fff; }
  .actions button.danger{ border-color:#c0392b; color:#c0392b; }

  /* bottom nav */
  footer{
    flex:none; display:flex; align-items:stretch; gap:10px; padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--line-soft); box-shadow:0 -2px 10px rgba(20,30,70,.08);
  }
  .nav-prev{ flex:none; width:58px; background:#eef0f7; color:var(--navy); font-size:24px; font-weight:800; border-radius:12px; }
  .nav-prev:active{ background:#e0e4f0; } .nav-prev:disabled{ opacity:.35; }
  .nav-primary{
    flex:1; background:var(--green); color:#fff; font-size:19px; font-weight:800; border-radius:12px;
    padding:16px; letter-spacing:.3px; box-shadow:0 2px 8px rgba(46,125,50,.3);
  }
  .nav-primary:active{ background:#256428; }
  .nav-primary.att{ background:var(--navy); box-shadow:0 2px 8px rgba(26,35,126,.3); }
  .nav-primary.att:active{ background:var(--navy-d); }
  .nav-primary small{ display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:2px; letter-spacing:0; }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(15,20,45,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .overlay.on{ display:flex; }
  .sheet{ background:#fff; border-radius:16px; width:100%; max-width:460px; max-height:80vh; overflow:auto; padding:18px; }
  .sheet h3{ font-size:15px; color:var(--navy); margin-bottom:10px; font-weight:800; }
  .sheet textarea{ width:100%; min-height:200px; font-size:13px; font-family:ui-monospace,monospace; border:1.5px solid var(--line); border-radius:10px; padding:10px; }
  .sheet .row{ display:flex; gap:9px; margin-top:12px; }
  .sheet .row button{ flex:1; padding:12px; border-radius:10px; font-weight:700; border:1.5px solid var(--navy); color:var(--navy); }
  .sheet .row button.solid{ background:var(--navy); color:#fff; }

  /* reorder mode */
  .rbtn{ font-size:12.5px; font-weight:800; color:var(--navy); background:#eef0f7; border-radius:20px; padding:7px 13px; flex:none; }
  .rbtn.on{ background:var(--navy); color:#fff; }
  .rbanner{ font-size:12.5px; color:var(--amber); font-weight:700; }
  .ritem{ display:flex; align-items:center; gap:8px; min-height:54px; padding:8px 10px; margin:6px 0; border:1.5px solid var(--line); border-radius:11px; background:#fff; touch-action:none; }
  .ritem.drag{ background:#eef4ff; border-color:var(--blue); box-shadow:0 6px 16px rgba(20,40,90,.20); }
  .rhandle{ font-size:19px; color:var(--dim); width:30px; text-align:center; cursor:grab; }
  .rname{ flex:1; font-size:16px; font-weight:600; }
  .rmove{ display:flex; gap:5px; }
  .rmove button{ width:40px; height:40px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-weight:800; color:var(--navy); }
  .rmove button:active{ background:#eef0f7; }
  .rmove button:disabled{ opacity:.3; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div class="brand">Cabinet Check<small>UGE · Concourse B/A</small></div>
    <div class="seg">
      <button data-view="check" class="active">Walk</button>
      <button data-view="over">Overview</button>
    </div>
  </div>
  <div class="hdr-sub">
    <span class="meta-sum" id="metaSum">Tap Overview to set date / shift</span>
    <span class="overall" id="overall">0 / 0</span>
  </div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
</header>

<main id="main">
  <section id="checkView"><div class="card" id="card"></div></section>

  <section id="overView" hidden>
    <div class="ov-card">
      <h3>Shift Info</h3>
      <div class="field"><label>Date</label><input id="mDate" type="text" placeholder="Jul 8"></div>
      <div class="field"><label>Shift</label><input id="mShift" type="text" placeholder="AM / PM / OVN"></div>
      <div class="field"><label>Checked by</label><input id="mBy" type="text" placeholder="Your name"></div>
    </div>
    <div class="ov-card">
      <h3>Progress</h3>
      <div class="stats">
        <div class="stat g"><div class="n" id="stGood">0</div><div class="l">Good</div></div>
        <div class="stat a"><div class="n" id="stFlag">0</div><div class="l">Needs restock</div></div>
        <div class="stat n"><div class="n" id="stLeft">0</div><div class="l">Not checked</div></div>
      </div>
    </div>
    <div class="ov-card">
      <div class="fseg" id="fseg">
        <button data-f="all" class="active">All</button>
        <button data-f="flag">Needs restock</button>
        <button data-f="left">Not checked</button>
      </div>
      <div id="zoneList"></div>
    </div>
    <div class="ov-card">
      <h3>Export &amp; Backup</h3>
      <div class="actions">
        <button class="solid" id="btnCopy">Copy report</button>
        <button id="btnBackup">Download backup</button>
        <button id="btnRestore">Restore backup</button>
        <button class="danger" id="btnReset">Reset all</button>
      </div>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </section>
</main>

<footer id="nav">
  <button class="nav-prev" id="prevBtn">&#8249;</button>
  <button class="nav-primary" id="primaryBtn"></button>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="mHead">Report</h3>
    <textarea id="mText" readonly></textarea>
    <div class="row">
      <button id="mSelect" class="solid">Select all</button>
      <button id="mClose">Close</button>
    </div>
  </div>
</div>

<script>
  /* ═══════════ items ═══════════ */
  const ITEMS = [
    { key:"gloves",   label:"Gloves" },
    { key:"dividers", label:"Dividers" },
    { key:"holders",  label:"Glove Holders" },
    { key:"prov",     label:"Provisions" },
    { key:"basket",   label:"Basket" },
    { key:"bags",     label:"Bags" },
    { key:"trash",    label:"Trash Bags" },
    { key:"wypall",   label:"WypAlls" },
    { key:"soap",     label:"Soap" },
    { key:"facial",   label:"Facial Towels" },
    { key:"towels",   label:"Towels" },
    { key:"tp",       label:"Toilet Paper" },
    { key:"ppe",      label:"PPE" },
    { key:"maxi",     label:"Maxi Pads" }
  ];
  const CHIPS = ["Low stock","Broken","Locked","Dirty","Skipped"];

  // Gates from the shift board. Order follows the sides you walk:
  // A sub-zone (odds) first, then B sub-zone (evens) — one side, then the other.
  const ZONES = [
    { z:"Zone 1", subs:[
      { label:"1A", van:"V-12", gates:["B7","B9","B11"] },
      { label:"1B", van:"V-12", gates:["B8","B10","B12"] } ] },
    { z:"Zone 2", subs:[
      { label:"2A", van:"V-08", gates:["B15","B17","B19","B21"] },
      { label:"2B", van:"V-08", gates:["B16","B18","B20","B22"] } ] },
    { z:"Zone 3", subs:[
      { label:"3A", van:"V-15", gates:["B23","B25","B27","B29"] },
      { label:"3B", van:"V-15", gates:["B24","B26","B28"] } ] },
    { z:"Zone 4", subs:[
      { label:"4A", van:"V-22", gates:["B31","B35","B37"] },
      { label:"4B", van:"V-22", gates:["B32","B36"] },
      { label:"4C", van:"V-23", gates:["B38","B42","B44"] },
      { label:"4D", van:"V-23", gates:["B39","B41","B43"] } ] },
    { z:"Zone 5", subs:[
      { label:"5A", van:"V-30", gates:["B45","B47","B49","B51"] },
      { label:"5B", van:"V-30", gates:["B46","B48","B50","B52"] } ] },
    { z:"Zone 6", subs:[
      { label:"6A", van:"V-35", gates:["B53","B55","B57","B59","B61"] },
      { label:"6B", van:"V-35", gates:["B54","B56","B58","B60"] } ] },
    { z:"Zone 7", subs:[
      { label:"7A", van:"V-40", gates:["B62","B63","B64","B65","B66"] },
      { label:"7B", van:"V-40", gates:["B67","B68","B69","B70","B71"] } ] },
    { z:"Zone 8", subs:[
      { label:"8A", van:"V-44", gates:["B80","B82","B84","B86","B88"] },
      { label:"8B", van:"V-44", gates:["B90","B92","B94","B95"] } ] },
    { z:"Zone 9", subs:[
      { label:"9A", van:"V-50", gates:["A14","A16","A18","A20","A22"] },
      { label:"9B", van:"V-50", gates:["A24","A26","A28","A30"] },
      { label:"9C", van:"V-51 · Intl", gates:["A32","A34","A36","A38","A40"] } ] }
  ];

  const GATES = [];
  ZONES.forEach(zone => zone.subs.forEach(sub =>
    sub.gates.forEach(code => GATES.push({ code, zone:zone.z, sub:sub.label, van:sub.van }))));
  const TOTAL = GATES.length;
  const INDEX = {}; GATES.forEach((g,i)=>INDEX[g.code]=i);

  /* ═══════════ state ═══════════ */
  const KEY = "uge-cabinet-check-mobile-v2";
  function loadState(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
  let state = loadState();
  state.gates = state.gates || {};
  state.meta  = state.meta  || {};
  state.ui    = state.ui    || {};
  let saveTimer = null;
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }

  const DEF = { low:{}, tags:{}, note:"", visited:false };
  function gRead(code){ return state.gates[code] || DEF; }
  function gWrite(code){ let g=state.gates[code]; if(!g){ g={low:{},tags:{},note:"",visited:false}; state.gates[code]=g; } return g; }
  function lowCount(code){ return Object.keys(gRead(code).low).length; }
  function tagCount(code){ return Object.keys(gRead(code).tags).length; }
  function hasNote(code){ return !!(gRead(code).note); }
  function needsAtt(code){ return lowCount(code)>0 || tagCount(code)>0 || hasNote(code); }
  function isVisited(code){ return gRead(code).visited===true; }
  function isGood(code){ return isVisited(code) && !needsAtt(code); }
  function statusOf(code){ return !isVisited(code) ? "left" : (needsAtt(code) ? "att" : "good"); }

  let idx = Math.min(Math.max(parseInt(state.ui.idx)||0,0), TOTAL-1);
  let view = "check";
  let filter = "all";
  let reorderMode = false;

  const $ = s => document.querySelector(s);
  const card = $("#card"), main = $("#main");

  /* ═══════════ item order (editable, applies everywhere) ═══════════ */
  const ITEM_MAP = Object.fromEntries(ITEMS.map(i=>[i.key,i]));
  function orderKeys(){
    const known = ITEMS.map(i=>i.key);
    if(!Array.isArray(state.order)) state.order = known.slice();
    state.order = state.order.filter(k=>known.indexOf(k)>=0);
    known.forEach(k=>{ if(state.order.indexOf(k)<0) state.order.push(k); });
    return state.order;
  }
  function orderedItems(){ return orderKeys().map(k=>ITEM_MAP[k]); }
  function moveKey(key,dir){
    const arr=orderKeys(), i=arr.indexOf(key), j=i+dir;
    if(i<0||j<0||j>=arr.length) return;
    arr.splice(j,0,arr.splice(i,1)[0]);
    save(); renderCard();
  }

  /* ═══════════ checklist render ═══════════ */
  function renderCard(){
    const g = GATES[idx], gd = gRead(g.code), oi = orderedItems();
    let body;
    if(reorderMode){
      const rrows = oi.map((it,i)=>`<div class="ritem" data-key="${it.key}">
          <span class="rhandle" data-role="handle">&#9776;</span>
          <span class="rname">${it.label}</span>
          <span class="rmove"><button data-dir="-1" ${i===0?"disabled":""}>&#9650;</button><button data-dir="1" ${i===oi.length-1?"disabled":""}>&#9660;</button></span>
        </div>`).join("");
      body = `<div class="hint-line" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span class="rbanner">Drag or use arrows &mdash; applies to every cabinet.</span>
          <button class="rbtn on" id="reorderBtn">Done</button></div>
        <div class="items" id="items">${rrows}</div>`;
    } else {
      const rows = oi.map(it => {
        const low = !!gd.low[it.key];
        return `<div class="item ${low?"low":""}" data-key="${it.key}">
          <span class="i-name">${it.label}</span>
          <span class="tag">${low?"LOW":""}</span>
          <span class="box">!</span></div>`;
      }).join("");
      const chips = CHIPS.map(c => `<button class="qchip ${gd.tags[c]?"on":""}" data-chip="${c}">${c}</button>`).join("");
      body = `<div class="hint-line" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span>Tap anything <b>low or missing</b>.</span>
          <button class="rbtn" id="reorderBtn">&#8597; Order</button></div>
        <div class="items" id="items">${rows}</div>
        <div class="chips-wrap"><div class="chips-l">Cabinet issue (optional)</div><div class="qchips" id="qchips">${chips}</div></div>
        <div class="note-wrap"><input id="note" type="text" placeholder="Optional note — only if you want"></div>`;
    }
    card.innerHTML = `
      <div class="card-hd" id="cardHd">
        <div class="g-code">${g.code}</div>
        <div class="g-meta">${g.zone} &middot; ${g.sub} &middot; Van ${g.van}<br>Cabinet ${idx+1} of ${TOTAL}</div>
        <div class="g-chip" id="cardChip"></div>
      </div>${body}`;
    if(!reorderMode){ const n=$("#note"); if(n) n.value = gd.note || ""; }
    updateStatus();
    main.scrollTop = 0;
  }
  function updateStatus(){
    const code = GATES[idx].code, st = statusOf(code), low = lowCount(code);
    const hd = $("#cardHd"), chip = $("#cardChip");
    hd.classList.toggle("good", st==="good");
    hd.classList.toggle("att", st==="att");
    chip.textContent = st==="good" ? "Good ✓" : st==="att" ? (low?low+" low":"Flagged") : "Not checked";
    // primary button
    const att = needsAtt(code), last = idx===TOTAL-1;
    const p = $("#primaryBtn");
    p.classList.toggle("att", att);
    p.innerHTML = att
      ? `Save &amp; Next &#9654;<small>${low?low+" low":""}${low&&(tagCount(code)||hasNote(code))?" · ":""}${tagCount(code)||hasNote(code)?"flagged":""}</small>`
      : `All good &#9654;<small>${last?"last cabinet":"nothing low here"}</small>`;
  }

  // tap item = flag low / unflag
  card.addEventListener("click", e => {
    if(e.target.id==="reorderBtn"){ reorderMode=!reorderMode; renderCard(); return; }
    const mv = e.target.closest(".rmove button");
    if(mv){ const ri=e.target.closest(".ritem"); if(ri) moveKey(ri.dataset.key, parseInt(mv.dataset.dir,10)); return; }
    const row = e.target.closest(".item");
    if(row){
      const code=GATES[idx].code, key=row.dataset.key, g=gWrite(code);
      g.visited=true;
      if(g.low[key]) delete g.low[key]; else g.low[key]=true;
      row.classList.toggle("low", !!g.low[key]);
      row.querySelector(".tag").textContent = g.low[key] ? "LOW" : "";
      save(); updateStatus(); updateHeader();
      return;
    }
    const qc = e.target.closest(".qchip");
    if(qc){
      const code=GATES[idx].code, c=qc.dataset.chip, g=gWrite(code);
      g.visited=true;
      if(g.tags[c]) delete g.tags[c]; else g.tags[c]=true;
      qc.classList.toggle("on", !!g.tags[c]);
      save(); updateStatus(); updateHeader();
    }
  });
  card.addEventListener("input", e => {
    if(e.target.id!=="note") return;
    const code=GATES[idx].code, g=gWrite(code);
    g.visited=true; g.note=e.target.value; if(!g.note) delete g.note;
    saveSoon(); updateStatus(); updateHeader();
  });

  /* ═══════════ navigation ═══════════ */
  function go(i){ idx=Math.min(Math.max(i,0),TOTAL-1); state.ui.idx=idx; save(); renderCard(); updateNav(); }
  function primary(){
    const code=GATES[idx].code; gWrite(code).visited=true; save();
    if(idx===TOTAL-1){ updateHeader(); setView("over"); return; }
    go(idx+1); updateHeader();
  }
  $("#prevBtn").addEventListener("click", ()=>go(idx-1));
  $("#primaryBtn").addEventListener("click", primary);
  function updateNav(){ $("#prevBtn").disabled = idx===0; }

  // drag-to-reorder (pointer on the handle; lift then drop to position)
  card.addEventListener("pointerdown", e=>{
    if(!reorderMode) return;
    const handle = e.target.closest("[data-role=handle]"); if(!handle) return;
    e.preventDefault();
    const row = handle.closest(".ritem"), list = row.parentElement;
    const rows = [...list.querySelectorAll(".ritem")];
    const rects = rows.map(r=>r.getBoundingClientRect());
    const key = row.dataset.key, startY = e.clientY;
    row.classList.add("drag");
    const onMove = ev => { row.style.transform = `translateY(${ev.clientY-startY}px)`; };
    const onUp = ev => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      let target = 0;
      rows.forEach((r,i)=>{ if(r===row) return; const c=rects[i].top+rects[i].height/2; if(ev.clientY>c) target++; });
      const arr = orderKeys(), from = arr.indexOf(key);
      arr.splice(from,1); arr.splice(target,0,key);
      save(); renderCard();
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });

  // swipe: navigate only (does not mark visited)
  let tx=0,ty=0;
  main.addEventListener("touchstart", e=>{ if(view!=="check"||reorderMode)return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
  main.addEventListener("touchend", e=>{
    if(view!=="check"||reorderMode)return;
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.8){ if(dx<0) go(idx+1); else go(idx-1); }
  }, {passive:true});

  /* ═══════════ header ═══════════ */
  function updateHeader(){
    let good=0,att=0;
    for(const g of GATES){ const s=statusOf(g.code); if(s==="good")good++; else if(s==="att")att++; }
    const visited=good+att;
    $("#overall").textContent = visited+" / "+TOTAL;
    $("#pfill").style.width = (TOTAL?visited/TOTAL*100:0)+"%";
    const m=state.meta, parts=[];
    if(m.date)parts.push(m.date); if(m.shift)parts.push(m.shift); if(m.by)parts.push(m.by);
    $("#metaSum").textContent = parts.length ? parts.join("  ·  ") : "Tap Overview to set date / shift";
    return {good,att,visited};
  }

  /* ═══════════ views ═══════════ */
  function setView(v){
    view=v;
    document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("active", b.dataset.view===v));
    $("#checkView").hidden=v!=="check"; $("#overView").hidden=v!=="over"; $("#nav").hidden=v!=="check";
    if(v==="over") renderOverview();
    main.scrollTop=0;
  }
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click", ()=>setView(b.dataset.view)));
  $("#fseg").querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
    filter=b.dataset.f;
    $("#fseg").querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
    renderOverview();
  }));

  function renderOverview(){
    const {good,att,visited}=updateHeader();
    $("#stGood").textContent=good; $("#stFlag").textContent=att; $("#stLeft").textContent=TOTAL-visited;
    const wrap=$("#zoneList");
    const pass = code => filter==="all" || (filter==="flag" && statusOf(code)==="att") || (filter==="left" && statusOf(code)==="left");
    wrap.innerHTML = ZONES.map(zone=>{
      const gates=GATES.filter(g=>g.zone===zone.z);
      const shown=gates.filter(g=>pass(g.code));
      if(!shown.length) return "";
      const gd=gates.filter(g=>isGood(g.code)).length;
      const van=zone.subs.map(s=>s.van).filter((v,i,a)=>a.indexOf(v)===i).join(" / ");
      const chips=shown.map(g=>{
        const st=statusOf(g.code), low=lowCount(g.code);
        const f = st==="good"?"good": st==="att"?(low?low+" low":"flag"):"—";
        return `<button class="chip ${st==="good"?"good":st==="att"?"att":""} ${INDEX[g.code]===idx?"here":""}" data-code="${g.code}">
          <div class="c">${g.code}</div><div class="f">${f}</div></button>`;
      }).join("");
      return `<div class="zone-blk"><div class="zone-ttl">
        <span>${zone.z} &nbsp;<span style="color:var(--muted);font-weight:700">${gd}/${gates.length}</span></span>
        <span class="van">Van ${van}</span></div><div class="chips">${chips}</div></div>`;
    }).join("") || `<p style="color:var(--muted);font-size:14px;text-align:center;padding:14px">Nothing here.</p>`;
    wrap.querySelectorAll(".chip").forEach(c=>c.addEventListener("click", ()=>{ go(INDEX[c.dataset.code]); setView("check"); }));
  }

  /* ═══════════ meta ═══════════ */
  [["mDate","date"],["mShift","shift"],["mBy","by"]].forEach(([id,k])=>{
    const el=$("#"+id); el.value=state.meta[k]||"";
    el.addEventListener("input", ()=>{ state.meta[k]=el.value; if(!el.value)delete state.meta[k]; saveSoon(); updateHeader(); });
  });

  /* ═══════════ export / backup ═══════════ */
  function buildReport(){
    const m=state.meta, L=[];
    L.push("CABINET CHECK — "+(m.date||"(no date)")+(m.shift?"  "+m.shift:"")+(m.by?"  ·  "+m.by:""));
    let good=0,att=0; for(const g of GATES){ const s=statusOf(g.code); if(s==="good")good++; else if(s==="att")att++; }
    L.push("Good: "+good+"   Needs restock: "+att+"   Not checked: "+(TOTAL-good-att)+"   (of "+TOTAL+")");
    L.push("");
    L.push("NEEDS RESTOCK:");
    let any=false;
    for(const g of GATES){ if(statusOf(g.code)!=="att") continue; any=true;
      const gd=gRead(g.code);
      const low=orderedItems().filter(it=>gd.low[it.key]).map(it=>it.label);
      const tags=Object.keys(gd.tags);
      let s="  "+g.code+" ("+g.zone+")";
      const bits=[];
      if(low.length) bits.push("low: "+low.join(", "));
      if(tags.length) bits.push(tags.join(", "));
      if(gd.note) bits.push("note: "+gd.note);
      if(bits.length) s+=" — "+bits.join(" | ");
      L.push(s);
    }
    if(!any) L.push("  none");
    const left=GATES.filter(g=>statusOf(g.code)==="left").map(g=>g.code);
    L.push(""); L.push("NOT CHECKED ("+left.length+"): "+(left.length?left.join(", "):"none"));
    return L.join("\n");
  }
  function showModal(h,t){ $("#mHead").textContent=h; $("#mText").value=t; $("#overlay").classList.add("on"); }
  $("#mClose").addEventListener("click", ()=>$("#overlay").classList.remove("on"));
  $("#mSelect").addEventListener("click", ()=>{ const t=$("#mText"); t.focus(); t.select(); try{document.execCommand("copy");}catch(e){} });
  $("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") $("#overlay").classList.remove("on"); });
  $("#btnCopy").addEventListener("click", async ()=>{
    const txt=buildReport();
    try{ await navigator.clipboard.writeText(txt); flash($("#btnCopy"),"Copied ✓"); }
    catch(e){ showModal("Report — copy this", txt); }
  });
  $("#btnBackup").addEventListener("click", ()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="cabinet-check-backup.json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
  });
  $("#btnRestore").addEventListener("click", ()=>$("#fileIn").click());
  $("#fileIn").addEventListener("change", e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(!data||typeof data!=="object"||!data.gates) throw 0;
      if(!confirm("Replace what's on this phone with the backup file?")) return;
      state=data; state.gates=state.gates||{}; state.meta=state.meta||{}; state.ui=state.ui||{};
      idx=Math.min(Math.max(parseInt(state.ui.idx)||0,0),TOTAL-1);
      save(); syncMeta(); renderCard(); updateNav(); updateHeader(); setView("over");
    }catch(err){ alert("Couldn't read that backup file."); } };
    r.readAsText(f); e.target.value="";
  });
  $("#btnReset").addEventListener("click", ()=>{
    if(!confirm("Clear every cabinet's checks and notes? (Keeps date / shift / name.)")) return;
    state.gates={}; save(); renderCard(); updateHeader(); renderOverview();
  });
  function syncMeta(){ [["mDate","date"],["mShift","shift"],["mBy","by"]].forEach(([id,k])=>$("#"+id).value=state.meta[k]||""); }
  function flash(btn,txt){ const o=btn.textContent; btn.textContent=txt; setTimeout(()=>btn.textContent=o,1200); }

  /* ═══════════ boot ═══════════ */
  renderCard(); updateNav(); updateHeader();
</script>
</body>
</html>
